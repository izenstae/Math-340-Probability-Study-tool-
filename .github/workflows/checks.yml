name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke-test every practice generator
        run: node tools/check-generators.js 2000
      - name: Test the study logic (grading, scheduling, migration)
        run: node tools/check-app.js
